name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (example: v3.0.1)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: LoqNova.WPF/LoqNova.WPF.csproj
  PUBLISH_DIR: artifacts/publish/win-x64

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: .\make.bat

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: build_installer\LoqNovaSetup.exe
          if-no-files-found: warn

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.release_tag, 'v'))
    needs: build
    runs-on: windows-2022

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          }
          else {
            $tag = "${{ github.event.inputs.release_tag }}"
          }

          if (-not $tag) {
            throw "No release tag provided."
          }

          if ($tag -notmatch '^v.+') {
            throw "Release tag must start with 'v'. Received: $tag"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WPF project (win-x64 runtime)
        run: dotnet restore ${{ env.PROJECT_PATH }} -r win-x64

      - name: Build WPF project (Release, win-x64)
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release -r win-x64 --no-restore

      - name: Publish self-contained single EXE (win-x64)
        run: >-
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          --self-contained true
          --no-build
          -o ${{ env.PUBLISH_DIR }}
          /p:PublishSingleFile=true
          /p:PublishReadyToRun=false
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Normalize EXE name
        id: package
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $publishDir = "${{ env.PUBLISH_DIR }}"

          if (-not (Test-Path $publishDir)) {
            throw "Publish directory not found: $publishDir"
          }

          $mainExe = Join-Path $publishDir "LOQ Nova.exe"
          if (-not (Test-Path $mainExe)) {
            $mainExe = Get-ChildItem -Path $publishDir -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "WebView2Loader|vcruntime|msvcp|concrt" } |
              Sort-Object Length -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $mainExe -or -not (Test-Path $mainExe)) {
            throw "Main EXE not found in $publishDir"
          }

          $releaseExe = Join-Path $publishDir ("LoqNova-{0}-win-x64.exe" -f $tag)
          Copy-Item -Path $mainExe -Destination $releaseExe -Force
          "release_asset=$releaseExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoqNova-${{ steps.release_tag.outputs.tag }}-win-x64
          path: ${{ steps.package.outputs.release_asset }}

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: ${{ steps.package.outputs.release_asset }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
