name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (example: v3.1.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: LoqNova.WPF/LoqNova.WPF.csproj
  PUBLISH_DIR: artifacts/publish/win-x64

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "${{ env.PROJECT_PATH }}"
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version

          if (-not $version) {
            throw "Could not read <Version> from ${{ env.PROJECT_PATH }}"
          }

          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([.-].+)?$') {
            throw "Unexpected project version format: $version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version_tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore

      - name: Build
        run: .\make.bat ${{ steps.version.outputs.version }}

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoqNova-v${{ steps.version.outputs.version }}-setup
          path: build_installer\LoqNova-v${{ steps.version.outputs.version }}-setup.exe
          if-no-files-found: warn

  release:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.release_tag, 'v'))
    needs: build
    runs-on: windows-2022

    steps:
      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $refName = "${{ github.ref_name }}"
          $projectVersion = "${{ needs.build.outputs.version }}"
          $versionTag = "${{ needs.build.outputs.version_tag }}"
          $manualTag = "${{ github.event.inputs.release_tag }}"

          if (-not $projectVersion) {
            throw "Project version was not propagated from build job."
          }

          $releaseTag = $versionTag

          if ($eventName -eq "push" -and "${{ github.ref }}" -like "refs/tags/*") {
            if ($refName -ne $versionTag) {
              throw "Tag/version mismatch. Pushed tag '$refName' but project version is '$versionTag'."
            }
            $releaseTag = $refName
          }

          if ($eventName -eq "workflow_dispatch" -and $manualTag) {
            if ($manualTag -ne $versionTag) {
              throw "Manual tag/version mismatch. Input tag '$manualTag' but project version is '$versionTag'."
            }
            $releaseTag = $manualTag
          }

          "version=$projectVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WPF project (win-x64 runtime)
        run: dotnet restore ${{ env.PROJECT_PATH }} -r win-x64

      - name: Build WPF project (Release, win-x64, self-contained)
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release -r win-x64 --self-contained true --no-restore

      - name: Publish self-contained single EXE (win-x64)
        run: >-
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          --self-contained true
          --no-build
          -o ${{ env.PUBLISH_DIR }}
          /p:Version=${{ steps.release_meta.outputs.version }}
          /p:FileVersion=${{ steps.release_meta.outputs.version }}
          /p:PublishSingleFile=true
          /p:PublishReadyToRun=false
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Normalize EXE name
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          $publishDir = "${{ env.PUBLISH_DIR }}"

          if (-not (Test-Path $publishDir)) {
            throw "Publish directory not found: $publishDir"
          }

          $mainExe = Join-Path $publishDir "LOQ Nova.exe"
          if (-not (Test-Path $mainExe)) {
            $mainExe = Get-ChildItem -Path $publishDir -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "WebView2Loader|vcruntime|msvcp|concrt" } |
              Sort-Object Length -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $mainExe -or -not (Test-Path $mainExe)) {
            throw "Main EXE not found in $publishDir"
          }

          $releaseExe = Join-Path $publishDir ("LoqNova-v{0}.exe" -f $version)
          Copy-Item -Path $mainExe -Destination $releaseExe -Force
          "release_asset=$releaseExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoqNova-v${{ steps.release_meta.outputs.version }}
          path: ${{ steps.package.outputs.release_asset }}

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.package.outputs.release_asset }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
