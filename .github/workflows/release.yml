name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT_PATH: LoqNova.WPF/LoqNova.WPF.csproj
  PUBLISH_DIR: artifacts/publish/win-x64

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build (Release)
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Publish self-contained single EXE (win-x64)
        run: >-
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -r win-x64
          --self-contained true
          --no-build
          -o ${{ env.PUBLISH_DIR }}
          /p:PublishSingleFile=true
          /p:PublishReadyToRun=false
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Normalize EXE name
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $publishDir = "${{ env.PUBLISH_DIR }}"

          if (-not (Test-Path $publishDir)) {
            throw "Publish directory not found: $publishDir"
          }

          $mainExe = Join-Path $publishDir "LOQ Nova.exe"
          if (-not (Test-Path $mainExe)) {
            $mainExe = Get-ChildItem -Path $publishDir -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "WebView2Loader|vcruntime|msvcp|concrt" } |
              Sort-Object Length -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $mainExe -or -not (Test-Path $mainExe)) {
            throw "Main EXE not found in $publishDir"
          }

          $releaseExe = Join-Path $publishDir ("LoqNova-{0}-win-x64.exe" -f $tag)
          Copy-Item -Path $mainExe -Destination $releaseExe -Force
          "release_asset=$releaseExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoqNova-${{ github.ref_name }}-win-x64
          path: ${{ steps.package.outputs.release_asset }}

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.package.outputs.release_asset }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
